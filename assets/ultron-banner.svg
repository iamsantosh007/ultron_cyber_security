<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Ultron — one-stop agentic cybersecurity for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070e"/>
      <stop offset="0.5" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#0e1526"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#36e6ff"/>
      <stop offset="0.45" stop-color="#8ad0ff"/>
      <stop offset="0.75" stop-color="#ff7a5c"/>
      <stop offset="1" stop-color="#ff4d4d"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#9af0ff"/>
      <stop offset="0.6" stop-color="#36b6ff"/>
      <stop offset="1" stop-color="#ff3b3b"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bd3ff" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#2bd3ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2bd3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36e6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#36e6ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#36e6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="60" height="52" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)">
      <path d="M15 0 L45 0 L60 26 L45 52 L15 52 L0 26 Z" fill="none" stroke="#17324f" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#hex)" opacity="0.5"/>

  <!-- scanlines -->
  <g stroke="#0a1a2e" stroke-width="1" opacity="0.35">
    <path d="M0 40 H1280 M0 80 H1280 M0 120 H1280 M0 160 H1280 M0 200 H1280 M0 240 H1280 M0 280 H1280 M0 320 H1280 M0 360 H1280"/>
  </g>
  <rect x="0" y="150" width="1280" height="90" fill="url(#scan)"/>

  <!-- diagonal data traces -->
  <g stroke="#1f5c7a" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M300 300 L360 300 L390 270 L520 270"/>
    <path d="M300 330 L420 330 L450 360 L620 360"/>
    <circle cx="520" cy="270" r="3" fill="#36e6ff" stroke="none"/>
    <circle cx="620" cy="360" r="3" fill="#ff5a52" stroke="none"/>
  </g>

  <!-- ===== HUD core at (230,190) ===== -->
  <g transform="translate(230 190)">
    <circle r="150" fill="url(#aura)"/>

    <!-- outer tick ring -->
    <g stroke="#2bd3ff" stroke-width="2" opacity="0.7">
      <circle r="120" fill="none" stroke-opacity="0.35"/>
      <g>
        <line x1="0" y1="-120" x2="0" y2="-104"/>
        <line x1="0" y1="120" x2="0" y2="104"/>
        <line x1="-120" y1="0" x2="-104" y2="0"/>
        <line x1="120" y1="0" x2="104" y2="0"/>
        <line x1="85" y1="-85" x2="74" y2="-74"/>
        <line x1="-85" y1="-85" x2="-74" y2="-74"/>
        <line x1="85" y1="85" x2="74" y2="74"/>
        <line x1="-85" y1="85" x2="-74" y2="74"/>
      </g>
    </g>

    <!-- broken targeting arcs -->
    <g fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M -96 -58 A 112 112 0 0 1 58 -96" stroke="#36e6ff" opacity="0.9"/>
      <path d="M 96 58 A 112 112 0 0 1 -58 96" stroke="#ff4d4d" opacity="0.9"/>
    </g>
    <g fill="none" stroke-width="2" opacity="0.6">
      <path d="M -70 -74 A 102 102 0 0 1 10 -101" stroke="#8ad0ff"/>
      <path d="M 70 74 A 102 102 0 0 1 -10 101" stroke="#ff8a7a"/>
    </g>

    <!-- hex frame -->
    <path d="M0 -74 L64 -37 L64 37 L0 74 L-64 37 L-64 -37 Z"
          fill="#060c17" stroke="#2bd3ff" stroke-width="2" opacity="0.9"/>

    <!-- core orb + eye -->
    <circle r="46" fill="url(#core)" filter="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="#05090f" opacity="0.72"/>
    <circle r="12" fill="#ffffff"/>
    <circle r="12" fill="url(#core)" opacity="0.5"/>
    <circle cx="4" cy="-4" r="4" fill="#ffffff"/>

    <!-- crosshair -->
    <g stroke="#9af0ff" stroke-width="1.5" opacity="0.8">
      <line x1="-140" y1="0" x2="-96" y2="0"/>
      <line x1="96" y1="0" x2="140" y2="0"/>
    </g>
  </g>

  <!-- corner HUD brackets -->
  <g stroke="#2bd3ff" stroke-width="2" fill="none" opacity="0.8">
    <path d="M20 20 H64 M20 20 V64"/>
    <path d="M1260 20 H1216 M1260 20 V64"/>
    <path d="M20 380 H64 M20 380 V336"/>
    <path d="M1260 380 H1216 M1260 380 V336"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(410 0)">
    <text x="0" y="178" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="140" font-weight="800" letter-spacing="10" fill="url(#word)" filter="url(#glow)">ULTRON</text>
    <text x="0" y="178" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="140" font-weight="800" letter-spacing="10" fill="none" stroke="#9af0ff" stroke-width="0.6" opacity="0.5">ULTRON</text>
    <text x="4" y="224" font-family="'Consolas','SF Mono',monospace" font-size="24" letter-spacing="3" fill="#7fd3ff">AGENTIC&#160;CYBERSECURITY&#160;//&#160;CLAUDE&#160;CODE</text>
  </g>

  <!-- angular skill chips -->
  <g font-family="'Consolas','SF Mono',monospace" font-size="20" font-weight="600">
    <g transform="translate(414 258)">
      <path d="M0 0 H176 V46 H14 L0 32 Z" fill="#0b1830" stroke="#ff5a52" stroke-width="1.5"/>
      <text x="88" y="30" text-anchor="middle" fill="#ff9a86">⚔ PENTEST</text>
    </g>
    <g transform="translate(606 258)">
      <path d="M0 0 H206 V46 H14 L0 32 Z" fill="#0b1830" stroke="#36b6ff" stroke-width="1.5"/>
      <text x="103" y="30" text-anchor="middle" fill="#9cc4ff">🔎 CODE-AUDIT</text>
    </g>
    <g transform="translate(828 258)">
      <path d="M0 0 H168 V46 H14 L0 32 Z" fill="#0b1830" stroke="#49d08b" stroke-width="1.5"/>
      <text x="84" y="30" text-anchor="middle" fill="#8ee9bd">🛡 DEFEND</text>
    </g>
  </g>

  <!-- telemetry readout -->
  <g font-family="'Consolas','SF Mono',monospace" font-size="16" fill="#4d6a8c">
    <text x="414" y="344">SCOPE:LOCKED</text>
    <text x="566" y="344" fill="#36e6ff">PROOF&gt;ALERTS</text>
    <text x="736" y="344">OWASP:2025</text>
    <text x="874" y="344" fill="#ff7a6a">ATT&amp;CK:v18</text>
    <text x="1000" y="344">MIT</text>
  </g>
</svg>
