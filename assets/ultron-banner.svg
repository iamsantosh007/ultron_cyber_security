<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Ultron — one-stop agentic cybersecurity for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e17"/>
      <stop offset="0.55" stop-color="#0d1322"/>
      <stop offset="1" stop-color="#131a2e"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a52"/>
      <stop offset="0.5" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a52" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a52" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#141c33"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#223052" stroke-width="1" opacity="0.35">
    <path d="M0 90 H1280 M0 180 H1280 M0 270 H1280"/>
    <path d="M160 0 V360 M320 0 V360 M480 0 V360 M640 0 V360 M800 0 V360 M960 0 V360 M1120 0 V360"/>
  </g>

  <!-- accent glow behind the eye -->
  <circle cx="140" cy="180" r="120" fill="url(#glow)"/>

  <!-- shield + eye glyph -->
  <g transform="translate(140 180)">
    <path d="M0 -92 L78 -58 V18 C78 66 44 96 0 112 C-44 96 -78 66 -78 18 V-58 Z"
          fill="#0e1526" stroke="#ff6a4d" stroke-width="4"/>
    <ellipse cx="0" cy="4" rx="46" ry="28" fill="#0a0f1c" stroke="#ff8a4d" stroke-width="3"/>
    <circle cx="0" cy="4" r="14" fill="url(#word)"/>
    <circle cx="5" cy="-2" r="4" fill="#fff" opacity="0.85"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="168" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="132" font-weight="800" letter-spacing="6" fill="url(#word)">ULTRON</text>
  <text x="304" y="214" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" letter-spacing="1" fill="#c6d2ea">One-stop agentic cybersecurity for Claude Code</text>

  <!-- skill chips -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600">
    <g transform="translate(304 250)">
      <rect width="168" height="46" rx="23" fill="url(#chip)" stroke="#ff6a4d" stroke-width="1.5"/>
      <text x="84" y="30" text-anchor="middle" fill="#ffb088">⚔  Pentest</text>
    </g>
    <g transform="translate(488 250)">
      <rect width="196" height="46" rx="23" fill="url(#chip)" stroke="#5aa0ff" stroke-width="1.5"/>
      <text x="98" y="30" text-anchor="middle" fill="#9cc4ff">🔎  Code Audit</text>
    </g>
    <g transform="translate(700 250)">
      <rect width="168" height="46" rx="23" fill="url(#chip)" stroke="#49d08b" stroke-width="1.5"/>
      <text x="84" y="30" text-anchor="middle" fill="#8ee9bd">🛡  Defend</text>
    </g>
  </g>

  <!-- proof-first tag -->
  <text x="1256" y="330" text-anchor="end" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#5e6e8c">proof over alerts · scope-disciplined · MIT</text>
</svg>
